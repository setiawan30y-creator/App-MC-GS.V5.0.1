<style>
*{box-sizing:border-box}
:root{--green:#10251c;--green2:#173a2a;--gold:#b89b5e;--bg:#f4f6f8;--text:#18212f;--muted:#687585;--border:#e1e7e3;--white:#fff;--danger:#b42318;--success:#16794a}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{height:58px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.topbar strong{font-size:18px}.topbar span{font-size:11px;margin-left:8px;opacity:.65}
.userbar{display:flex;align-items:center;gap:12px;font-size:13px}.logout{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;padding:7px 11px;border-radius:7px}
.shell{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:220px;background:#132d21;padding:18px 12px;color:#fff;flex:0 0 220px}
.brand{font-weight:800;letter-spacing:1px;margin:5px 10px 22px}.brand small{font-size:9px;opacity:.65}
.sidebar button{display:block;width:100%;border:0;background:transparent;color:#dfe9e2;text-align:left;padding:10px 12px;border-radius:7px;margin:2px 0}
.sidebar button:hover,.sidebar button.active{background:#1f4533;color:#fff}
.content{flex:1;padding:24px;overflow:auto}.page{display:none}.page.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-head h1{margin:0 0 5px}.subtitle{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card span{display:block;color:#6b7280;font-size:12px}.card strong{display:block;font-size:24px;margin-top:8px}
.panel{margin-top:18px}.panel-title{font-weight:700;font-size:16px;margin-bottom:14px}
pre{white-space:pre-wrap;color:#53616d}
.btn{border:0;border-radius:7px;padding:9px 14px;font-weight:600}
.btn-primary{background:#176b4a;color:#fff}.btn-secondary{background:#eef2ef;color:#26352c}.btn-danger{background:#fff0ef;color:#b42318}.btn-small{padding:6px 9px;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.filter{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px}
.data-table{width:100%;border-collapse:collapse;background:#fff;min-width:780px}
.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid #edf0ee;text-align:left;font-size:13px}
.data-table th{background:#f8faf9;color:#52605a;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.data-table tr:last-child td{border-bottom:0}
.status{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.status-active{background:#e9f7ef;color:#16794a}.status-inactive{background:#f1f3f5;color:#667085}
.empty{text-align:center;padding:35px;color:#7b8794}
.loading{text-align:center;padding:25px;color:#6b7280}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,20,14,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-backdrop.show{display:flex}
.modal{width:min(720px,100%);background:#fff;border-radius:13px;box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden}
.modal-head{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:18px}.modal-close{border:0;background:transparent;font-size:24px;color:#667085}
.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#344054}
.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d7dfda;border-radius:8px;outline:none}
.field input:focus,.field select:focus{border-color:#176b4a;box-shadow:0 0 0 3px rgba(23,107,74,.09)}
.field.full{grid-column:1/-1}.hint{font-size:11px;color:#8a95a0;margin-top:4px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.alert.show{display:block}.alert-error{background:#fff0ef;color:#b42318}.alert-success{background:#e9f7ef;color:#16794a}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10251c,#1c4935);padding:20px}
.login-card{width:min(420px,100%);background:#fff;border-radius:14px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.login-brand{font-weight:800;letter-spacing:1.5px;color:#173a2a}.login-sub{font-size:12px;color:#7a8790;margin:5px 0 22px}
.login-card .field{margin-bottom:14px}.login-card .btn{width:100%;margin-top:6px}
.login-note{font-size:11px;color:#8a95a0;margin-top:15px;text-align:center}
.hidden{display:none!important}
@media(max-width:900px){.sidebar{width:185px;flex-basis:185px}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.sidebar{width:62px;flex-basis:62px;padding:10px 6px}.brand{font-size:0;text-align:center}.brand small{display:none}.sidebar button{font-size:0;text-align:center}.sidebar button:first-letter{font-size:18px}.content{padding:16px}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:0 12px}}
</style>

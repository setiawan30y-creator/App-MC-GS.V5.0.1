<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#18212f}
.topbar{height:58px;background:#10251c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.topbar strong{font-size:18px}.topbar span{font-size:11px;margin-left:8px;opacity:.65}
.shell{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:220px;background:#132d21;padding:18px 12px;color:#fff}
.brand{font-weight:800;letter-spacing:1px;margin:5px 10px 22px}.brand small{font-size:9px;opacity:.65}
.sidebar button{display:block;width:100%;border:0;background:transparent;color:#dfe9e2;text-align:left;padding:10px 12px;border-radius:7px;margin:2px 0;cursor:pointer}
.sidebar button:hover{background:#1f4533}
.content{flex:1;padding:24px;overflow:auto}.page{display:none}.page.active{display:block}
h1{margin-top:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card,.panel{background:#fff;border:1px solid #e4e8eb;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card span{display:block;color:#6b7280;font-size:12px}.card strong{display:block;font-size:24px;margin-top:8px}
.panel{margin-top:18px}pre{white-space:pre-wrap;color:#53616d}
@media(max-width:900px){.sidebar{width:180px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
